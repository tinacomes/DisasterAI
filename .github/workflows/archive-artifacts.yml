name: Archive Run Artifacts

# Downloads artifacts from a finished workflow run and commits them into the
# repository (default: results/), one subdirectory per artifact. Use this to
# preserve sweep outputs past the artifact retention window — e.g. after a
# reviewer-requested re-run — by dispatching it with the run ID from the run's
# URL and the branch the results should land on.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID to pull artifacts from (number in the run's URL)"
        required: true
      pattern:
        description: "Artifact name glob (e.g. plots-config-*); {a,b} alternatives allowed"
        required: false
        default: "*"
      dest:
        description: "Destination directory in the repository"
        required: false
        default: "results"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # NOTE: actions/download-artifact@v4's run-id listing truncates at 100
      # artifacts (observed on the 132-cell gap sweep: only the newest 100
      # were downloaded, and pattern-filtered retries saw the same page).
      # Download via the REST API with --paginate instead; supports glob
      # patterns and {a,b} alternatives (expanded to comma-separated globs).
      - name: Download artifacts (paginated)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          PATTERN: ${{ inputs.pattern }}
          DEST: ${{ inputs.dest }}
        run: |
          mkdir -p "$DEST"
          PATS=$(echo "$PATTERN" | tr -d '{}' | tr ',' ' ')
          n=0
          gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --paginate --jq '.artifacts[] | "\(.id)\t\(.name)"' |
          while IFS=$'\t' read -r id name; do
            match=0
            for p in $PATS; do
              case "$name" in
                $p) match=1 ;;
              esac
            done
            if [ "$match" = "1" ]; then
              echo "Downloading $name ($id)"
              mkdir -p "$DEST/$name"
              gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > /tmp/artifact.zip
              unzip -oq /tmp/artifact.zip -d "$DEST/$name"
              n=$((n+1))
            fi
          done
          echo "Downloaded matching artifacts into $DEST"
      - name: Commit and push
        env:
          DEST: ${{ inputs.dest }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$DEST"
          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Archive artifacts from run $RUN_ID"
            git push
          fi
